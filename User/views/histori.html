<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Histori Reservasi - SiMontir</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
      body { background-color: #f8f9fa; }
      .navbar {
        background: white;
        border-bottom: 1px solid #dee2e6;
        height: 70px;
      }
      .navbar .container {
        height: 100%;
      }
      .navbar-brand, .nav-link {
        display: flex;
        align-items: center;
        height: 100%;
      }
      .nav-link.active {
        border-bottom: 2px solid #dc3545;
      }
      .brand-logo { height: 32px; }
      .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; }
      .card:hover { transform: translateY(-5px); }
      .card-icon { font-size: 2rem; color: #dc3545; }
      /* Histori specific styling */
      .table thead {
        background-color: #f8f9fa;
        border-bottom: 2px solid #dee2e6;
      }
      .table thead th {
        font-weight: 600;
        color: #495057;
      }
      .table tbody tr {
        transition: background-color 0.2s;
      }
      .table tbody tr:nth-child(even) {
        background-color: #f8f9fa;
      }
      .table tbody tr:hover {
        background-color: #e9ecef;
      }
      .badge {
        font-weight: 500;
      }
      .badge.bg-success { background-color: #28a745 !important; }
      .badge.bg-warning { background-color: #ffc107 !important; color: #212529; }
      .badge.bg-danger { background-color: #dc3545 !important; }
      .badge.bg-secondary { background-color: #6c757d !important; }
      h2, h5 {
        color: #343a40;
      }
      .alert-info {
        background-color: #d1ecf1;
        border-color: #bee5eb;
        color: #0c5460;
      }
      .btn-simontir {
        background-color: #dc3545;
        border-color: #dc3545;
      }
      .btn-simontir:hover {
        background-color: #c82333;
        border-color: #bd2130;
      }

      /* ===================== */
      /* Invoice styling       */
      /* ===================== */
      #invoiceArea {
        font-size: 0.9rem;
        color: #212529;
      }
      .invoice-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 2px solid #343a40;
        padding-bottom: 0.75rem;
        margin-bottom: 0.75rem;
      }
      .invoice-header .invoice-brand {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }
      .invoice-header .invoice-brand img {
        height: 56px;
        object-fit: contain;
      }
      .invoice-header .invoice-brand-name {
        font-weight: 800;
        font-size: 1.05rem;
        margin: 0;
        color: #212529;
      }
      .invoice-header .invoice-brand-info {
        font-size: 0.78rem;
        color: #555;
        margin: 0;
        line-height: 1.3;
      }
      .invoice-header .invoice-datetime {
        font-size: 0.8rem;
        color: #555;
        white-space: nowrap;
      }
      .invoice-title-block {
        text-align: center;
        margin-bottom: 1rem;
      }
      .invoice-title-block h4 {
        font-weight: 800;
        letter-spacing: 1px;
        margin-bottom: 0.15rem;
      }
      .invoice-title-block .invoice-number {
        font-weight: 700;
        color: #333;
      }
      .invoice-info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        margin-bottom: 1.25rem;
      }
      .invoice-info-grid dl {
        display: grid;
        grid-template-columns: 110px 10px 1fr;
        row-gap: 0.25rem;
        margin: 0;
        font-size: 0.85rem;
      }
      .invoice-info-grid dt { font-weight: 600; color: #333; }
      .invoice-info-grid dd { margin: 0; color: #333; }
      .invoice-section-label {
        font-weight: 700;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
      }
      .invoice-item-table th,
      .invoice-item-table td {
        font-size: 0.82rem;
        vertical-align: middle;
      }
      .invoice-item-table thead th {
        background: #f1f2f4;
        border-bottom: 1px solid #ccc;
      }
      .invoice-summary {
        width: 100%;
        max-width: 340px;
        margin-left: auto;
        font-size: 0.85rem;
      }
      .invoice-summary .row-line {
        display: flex;
        justify-content: space-between;
        padding: 0.25rem 0;
      }
      .invoice-summary .row-line.total {
        border-top: 1px solid #ccc;
        margin-top: 0.25rem;
        padding-top: 0.5rem;
        font-weight: 700;
        font-size: 0.95rem;
      }
      .invoice-summary .row-line.paid { font-weight: 700; }
      .invoice-stamp-wrap {
        display: flex;
        justify-content: flex-end;
        margin: 0.5rem 0;
      }
      .invoice-stamp {
        display: inline-block;
        border: 3px solid #d33;
        color: #d33;
        font-weight: 800;
        font-size: 1.1rem;
        letter-spacing: 2px;
        padding: 0.2rem 1rem;
        transform: rotate(-8deg);
        border-radius: 6px;
        opacity: 0.85;
      }
      .invoice-stamp.belum-lunas {
        border-color: #6c757d;
        color: #6c757d;
      }
      .invoice-footnote {
        text-align: center;
        margin-top: 1.25rem;
        padding-top: 0.75rem;
        border-top: 1px dashed #ccc;
        font-size: 0.78rem;
        color: #777;
      }

      @media print {
        body * { visibility: hidden; }
        #invoiceArea, #invoiceArea * { visibility: visible; }
        #invoiceArea {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
          <img class="brand-logo" src="/assets/logo-SiMontir.webp" alt="Logo SiMontir">
          SiMontir
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/reservasi">Reservasi</a></li>
            <li class="nav-item"><a class="nav-link fw-semibold" href="/histori">Histori</a></li>
          </ul>
          <div class="dropdown">
            <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="/profil"><i class="bi bi-person me-2"></i>Profil</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><button class="dropdown-item text-danger" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <main class="py-4">
      <div class="container">
        <div class="mb-4">
          <h1 class="h2 fw-bold">Histori Reservasi</h1>
          <p class="text-muted">Riwayat semua reservasi servis motor Anda</p>
        </div>

        <div class="alert alert-info" id="emptyState" style="display: none;">
          <div class="text-center py-4">
            <i class="bi bi-history fs-1 text-muted mb-3"></i>
            <p class="mb-0">Belum ada histori reservasi. Buat reservasi pertama Anda sekarang!</p>
            <a href="/reservasi" class="btn btn-simontir mt-3">Buat Reservasi</a>
          </div>
        </div>

        <div class="table-responsive" id="historyTableWrapper">
          <table class="table align-middle table-hover">
            <thead class="table-light">
              <tr>
                <th>No</th>
                <th>Tanggal</th>
                <th>Jam</th>
                <th>Kendaraan</th>
                <th>Plat Nomor</th>
                <th>Jenis Servis</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="historyTableBody">
              <!-- Data history will be loaded here -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Invoice Detail Modal -->
    <div class="modal fade" id="invoiceDetailModal" tabindex="-1" aria-labelledby="invoiceDetailModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="invoiceDetailModalLabel">Detail Invoice</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="invoiceDetailContent">
            <!-- Content will be loaded here -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-primary" id="printInvoiceBtn">
              <i class="bi bi-printer me-1"></i>Cetak
            </button>
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Tutup</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // ===================================================
      // Helper formatters
      // ===================================================
      const formatDate = (dateString) => {
        if (!dateString) return '-';
        return new Date(dateString).toLocaleDateString('id-ID', {
          day: '2-digit', month: '2-digit', year: 'numeric'
        });
      };

      const formatDateTime = (dateString) => {
        if (!dateString) return '-';
        const date = new Date(dateString);
        return `${formatDate(dateString)} ${date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}`;
      };

      const formatRupiah = (amount) => 'Rp ' + Number(amount || 0).toLocaleString('id-ID');

      const formatTime = (timeString) => timeString ? timeString.substring(0, 5) : '-';

      const getFirst = (val) => (Array.isArray(val) && val.length > 0 ? val[0] : (Array.isArray(val) ? null : val));

      const getNested = (obj, path) =>
        path.split('.').reduce((acc, part) => (acc && acc[part] !== undefined ? acc[part] : null), obj);

      // ===================================================
      // Build invoice HTML (AHASS-style layout)
      // ===================================================
      const buildInvoiceHtml = (reservation) => {
        const vehicleInfo = `${getNested(reservation, 'kendaraan.merk') || '-'} ${getNested(reservation, 'kendaraan.tipe') || ''}`.trim();
        const platNomor = getNested(reservation, 'kendaraan.nomor_polisi') || '-';
        const customerName = getNested(reservation, 'profiles.nama') || '-';
        const customerEmail = getNested(reservation, 'profiles.email') || '-';
        const customerPhone = getNested(reservation, 'profiles.telpon') || '-';
        const customerAlamat = getNested(reservation, 'profiles.alamat') || '-';
        const serviceType = getNested(reservation, 'jenis_servis') || '-';
        const keluhan = getNested(reservation, 'keluhan') || '-';

        const transaksiArray = getNested(reservation, 'transaksi_kasir') || [];
        const transaksi = getFirst(transaksiArray);
        const pembayaran = transaksi ? getFirst(getNested(transaksi, 'pembayaran')) : null;
        const detailTransaksi = transaksi ? (getNested(transaksi, 'detail_transaksi_kasir') || []) : [];

        const noInvoice = transaksi?.nomor_transaksi || `INV-${reservation.id}`;
        const tanggalTransaksi = transaksi?.created_at || reservation.created_at;
        const refNo = `WO.${reservation.id}`;
        const refDate = formatDate(reservation.tanggal_servis);
        const noPelanggan = getNested(reservation, 'profiles.id') ? `CS.${getNested(reservation, 'profiles.id')}` : '-';

        // Item rows
        const itemRows = detailTransaksi.map((item, index) => {
          const serviceRel = getFirst(getNested(item, 'service_catalog'));
          const stockRel = getFirst(getNested(item, 'stok_barang'));
          const itemName = serviceRel?.nama || stockRel?.nama || item.nama_item || '-';
          const qty = item.qty || 1;
          const harga = Number(item.harga || 0);
          const subtotal = harga * qty;
          return `
            <tr>
              <td>${index + 1}</td>
              <td>${item.kode || '-'}</td>
              <td>${itemName}</td>
              <td class="text-center">${qty}</td>
              <td class="text-center">${item.tipe_item === 'service' ? 'Jasa' : 'Pcs'}</td>
              <td class="text-end">${formatRupiah(harga)}</td>
              <td class="text-end">${formatRupiah(subtotal)}</td>
            </tr>
          `;
        }).join('');

        const subtotalItems = detailTransaksi.reduce(
          (sum, item) => sum + (Number(item.harga || 0) * (item.qty || 1)), 0
        );

        const diskon = Number(transaksi?.diskon || 0);
        const pajak = Number(transaksi?.pajak || 0);
        const totalTagihan = Number(transaksi?.total ?? (subtotalItems - diskon + pajak));
        const dibayarkan = Number(pembayaran?.nominal || 0);
        const kembalian = Number(pembayaran?.kembalian || 0);
        const sisaKewajiban = Math.max(0, totalTagihan - dibayarkan);
        const isLunas = pembayaran ? (pembayaran.status === 'dibayar' || sisaKewajiban <= 0) : false;

        return `
          <div id="invoiceArea">
            <div class="invoice-header">
              <div class="invoice-brand">
                <img src="/assets/logo-SiMontir.webp" alt="Logo SiMontir">
                <div>
                  <p class="invoice-brand-name">SIMONTIR BENGKEL &amp; SERVICE</p>
                  <p class="invoice-brand-info">
                    Penjualan - Pemeliharaan - Suku Cadang<br>
                    Jl. Raya SiMontir No. 123, Kota Servis<br>
                    Telp. (021) 123-4567
                  </p>
                </div>
              </div>
              <div class="invoice-datetime">${formatDateTime(tanggalTransaksi)}</div>
            </div>

            <div class="invoice-title-block">
              <h4>INVOICE</h4>
              <div class="invoice-number">${noInvoice}</div>
            </div>

            <div class="invoice-info-grid">
              <dl>
                <dt>No Pelanggan</dt><dd>:</dd><dd>${noPelanggan}</dd>
                <dt>Nama</dt><dd>:</dd><dd>${customerName}</dd>
                <dt>Alamat</dt><dd>:</dd><dd>${customerAlamat}</dd>
                <dt>Telpon</dt><dd>:</dd><dd>${customerPhone !== '-' ? customerPhone : customerEmail}</dd>
              </dl>
              <dl>
                <dt>No Polisi</dt><dd>:</dd><dd>${platNomor}</dd>
                <dt>Ref. No</dt><dd>:</dd><dd>${refNo}</dd>
                <dt>Ref. Date</dt><dd>:</dd><dd>${refDate}</dd>
                <dt>Jenis Servis</dt><dd>:</dd><dd>${serviceType}</dd>
              </dl>
            </div>

            <div class="invoice-section-label">#Sparepart / Jasa Servis</div>
            <div class="table-responsive mb-3">
              <table class="table table-bordered invoice-item-table">
                <thead>
                  <tr>
                    <th>No</th>
                    <th>Kode</th>
                    <th>Deskripsi</th>
                    <th class="text-center">Qty</th>
                    <th class="text-center">Tipe</th>
                    <th class="text-end">Harga</th>
                    <th class="text-end">Subtotal</th>
                  </tr>
                </thead>
                <tbody>
                  ${itemRows || `<tr><td colspan="7" class="text-center text-muted">Belum ada item transaksi</td></tr>`}
                </tbody>
              </table>
            </div>

            ${keluhan && keluhan !== '-' ? `
              <div class="mb-3">
                <div class="invoice-section-label">Keluhan</div>
                <p class="bg-light p-2 rounded">${keluhan}</p>
              </div>
            ` : ''}

            <div class="invoice-summary">
              <div class="row-line"><span>Sub Total</span><span>${formatRupiah(subtotalItems)}</span></div>
              <div class="row-line"><span>Diskon</span><span>${formatRupiah(diskon)}</span></div>
              <div class="row-line"><span>PPN / Pajak</span><span>${formatRupiah(pajak)}</span></div>
              <div class="row-line total"><span>Total Tagihan</span><span>${formatRupiah(totalTagihan)}</span></div>
              <div class="row-line paid"><span>Dibayarkan (${pembayaran?.metode || '-'})</span><span>${formatRupiah(dibayarkan)}</span></div>
              <div class="row-line"><span>Kembalian</span><span>${formatRupiah(kembalian)}</span></div>
            </div>

            <div class="invoice-stamp-wrap">
              <span class="invoice-stamp ${isLunas ? '' : 'belum-lunas'}">${isLunas ? 'LUNAS' : 'BELUM LUNAS'}</span>
            </div>

            <div class="invoice-summary">
              <div class="row-line"><span>Sisa Kewajiban</span><span>${formatRupiah(sisaKewajiban)}</span></div>
            </div>

            <div class="invoice-footnote">
              Terima kasih telah menggunakan layanan SiMontir.<br>
              Invoice ini sah tanpa tanda tangan.
            </div>
          </div>
        `;
      };

      // ===================================================
      // Show invoice detail in modal
      // ===================================================
      let invoiceDetailModal = null;

      async function showInvoiceDetail(reservationId) {
        const token = localStorage.getItem('simontir_token');
        if (!token) return;

        const modalContent = document.getElementById('invoiceDetailContent');

        modalContent.innerHTML = `
          <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3">Memuat detail invoice...</p>
          </div>
        `;

        if (!invoiceDetailModal) {
          invoiceDetailModal = new bootstrap.Modal(document.getElementById('invoiceDetailModal'));
        }
        invoiceDetailModal.show();

        try {
          const response = await fetch(`/api/reservations/${reservationId}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const reservation = await response.json();

          if (!response.ok) throw new Error(reservation.message || 'Gagal memuat detail reservasi');

          modalContent.innerHTML = buildInvoiceHtml(reservation);
        } catch (err) {
          console.error('Error loading invoice detail:', err);
          modalContent.innerHTML = `
            <div class="text-center py-4">
              <div class="text-danger">
                <i class="bi bi-exclamation-triangle fs-4 mb-3"></i>
                <p>${err.message}</p>
              </div>
              <button type="button" class="btn btn-outline-secondary" onclick="showInvoiceDetail('${reservationId}')">Coba Lagi</button>
            </div>
          `;
        }
      }

      document.getElementById('printInvoiceBtn').addEventListener('click', () => {
        window.print();
      });

      // ===================================================
      // Histori page functionality
      // ===================================================
      document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('simontir_token');
        if (!token) {
          window.location.href = '/login';
          return;
        }

        const historyTableBody = document.getElementById('historyTableBody');
        const emptyState = document.getElementById('emptyState');
        const historyTableWrapper = document.getElementById('historyTableWrapper');

        try {
          const response = await fetch('/api/reservations', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const reservations = await response.json();

          if (!response.ok) throw new Error(reservations.message || 'Gagal memuat histori');

          if (reservations.length === 0) {
            emptyState.style.display = 'block';
            historyTableWrapper.style.display = 'none';
            return;
          }

          emptyState.style.display = 'none';
          historyTableWrapper.style.display = 'block';

          reservations.forEach((res, index) => {
            const formattedDate = new Date(res.tanggal_servis).toLocaleDateString('id-ID', {
              day: '2-digit', month: '2-digit', year: 'numeric'
            });

            const formattedTime = res.jam_servis ? res.jam_servis.substring(0, 5) : '-';
            const vehicleInfo = `${res.kendaraan?.merk || '-'} ${res.kendaraan?.tipe || ''}`.trim();
            const platNomor = res.kendaraan?.nomor_polisi || '-';

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${index + 1}</td>
              <td>${formattedDate}</td>
              <td>${formattedTime}</td>
              <td>${vehicleInfo}</td>
              <td>${platNomor}</td>
              <td>${res.jenis_servis || '-'}</td>
              <td>
                <span class="badge bg-${res.status === 'success' ? 'success' : res.status === 'onProgress' ? 'warning' : 'secondary'}">
                  ${res.status === 'success' ? 'Selesai' : res.status === 'onProgress' ? 'Dalam Proses' : res.status || '-'}
                </span>
              </td>
              <td>
                <button class="btn btn-sm btn-outline-info" onclick="showInvoiceDetail('${res.id}')">
                  <i class="bi bi-file-earmark-text me-1"></i>Detail
                </button>
              </td>
            `;
            historyTableBody.appendChild(tr);
          });
        } catch (err) {
          console.error('Error loading history:', err);
          historyTableBody.innerHTML = `
            <tr>
              <td colspan="8" class="text-center text-danger">
                <i class="bi bi-exclamation-triangle me-2"></i>
                Gagal memuat histori: ${err.message}
              </td>
            </tr>
          `;
        }
      });

      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
          await fetch('/api/auth/logout', { method: 'POST' });
          localStorage.removeItem('simontir_token');
          localStorage.removeItem('simontir_email');
          window.location.href = '/';
        });
      }

      // Set active nav link
      const path = window.location.pathname;
      document.querySelectorAll('.nav-link').forEach(link => {
        if (link.getAttribute('href') === path) {
          link.classList.add('active');
        }
      });
    </script>
  </body>
</html>
