<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Histori Reservasi - SiMontir</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
      body { background-color: #f8f9fa; }
      .navbar {
        background: white;
        border-bottom: 1px solid #dee2e6;
        height: 70px;
      }
      .navbar .container {
        height: 100%;
      }
      .navbar-brand, .nav-link {
        display: flex;
        align-items: center;
        height: 100%;
      }
      .nav-link.active {
        border-bottom: 2px solid #dc3545;
      }
      .brand-logo { height: 32px; }
      .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; }
      .card:hover { transform: translateY(-5px); }
      .card-icon { font-size: 2rem; color: #dc3545; }
      /* Histori specific styling */
      .table thead {
        background-color: #f8f9fa;
        border-bottom: 2px solid #dee2e6;
      }
      .table thead th {
        font-weight: 600;
        color: #495057;
      }
      .table tbody tr {
        transition: background-color 0.2s;
      }
      .table tbody tr:nth-child(even) {
        background-color: #f8f9fa;
      }
      .table tbody tr:hover {
        background-color: #e9ecef;
      }
      .badge {
        font-weight: 500;
      }
      .badge.bg-success { background-color: #28a745 !important; }
      .badge.bg-warning { background-color: #ffc107 !important; color: #212529; }
      .badge.bg-danger { background-color: #dc3545 !important; }
      .badge.bg-secondary { background-color: #6c757d !important; }
      h2, h5 {
        color: #343a40;
      }
      .alert-info {
        background-color: #d1ecf1;
        border-color: #bee5eb;
        color: #0c5460;
      }
      .btn-simontir {
        background-color: #dc3545;
        border-color: #dc3545;
      }
      .btn-simontir:hover {
        background-color: #c82333;
        border-color: #bd2130;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
          <img class="brand-logo" src="/assets/logo-SiMontir.webp" alt="Logo SiMontir">
          SiMontir
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/reservasi">Reservasi</a></li>
            <li class="nav-item"><a class="nav-link fw-semibold" href="/histori">Histori</a></li>
          </ul>
          <div class="dropdown">
            <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="/profil"><i class="bi bi-person me-2"></i>Profil</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><button class="dropdown-item text-danger" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <main class="py-4">
      <div class="container">
        <div class="mb-4">
          <h1 class="h2 fw-bold">Histori Reservasi</h1>
          <p class="text-muted">Riwayat semua reservasi servis motor Anda</p>
        </div>

        <div class="alert alert-info" id="emptyState" style="display: none;">
          <div class="text-center py-4">
            <i class="bi bi-history fs-1 text-muted mb-3"></i>
            <p class="mb-0">Belum ada histori reservasi. Buat reservasi pertama Anda sekarang!</p>
            <a href="/reservasi" class="btn btn-simontir mt-3">Buat Reservasi</a>
          </div>
        </div>

        <div class="table-responsive" id="historyTableWrapper">
          <table class="table align-middle table-hover">
            <thead class="table-light">
              <tr>
                <th>No</th>
                <th>Tanggal</th>
                <th>Jam</th>
                <th>Kendaraan</th>
                <th>Plat Nomor</th>
                <th>Jenis Servis</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="historyTableBody">
              <!-- Data history will be loaded here -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Invoice Detail Modal -->
    <div class="modal fade" id="invoiceDetailModal" tabindex="-1" aria-labelledby="invoiceDetailModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="invoiceDetailModalLabel">Detail Invoice</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="invoiceDetailContent">
            <!-- Content will be loaded here -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Tutup</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Show invoice detail in modal
      let invoiceDetailModal = null;
      async function showInvoiceDetail(reservationId) {
        const token = localStorage.getItem('simontir_token');
        if (!token) return;

        const modalContent = document.getElementById('invoiceDetailContent');

        // Show loading state
        modalContent.innerHTML = `
          <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3">Memuat detail invoice...</p>
          </div>
        `;

        try {
          const response = await fetch(`/api/reservations/${reservationId}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const reservation = await response.json();

          if (!response.ok) throw new Error(reservation.message || 'Gagal memuat detail reservasi');

          // Helper to get first element if array or value itself
          const getFirst = (val) => {
            if (Array.isArray(val) && val.length > 0) return val[0];
            return val;
          };

          // Format functions
          const formatDate = (dateString) => {
            if (!dateString) return '-';
            const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
            return new Date(dateString).toLocaleDateString('id-ID', options);
          };

          const formatRupiah = (amount) => {
            if (amount === null || amount === undefined) return '-';
            return 'Rp ' + Number(amount).toLocaleString('id-ID');
          };

          const formatTime = (timeString) => {
            if (!timeString) return '-';
            return timeString.substring(0, 5); // HH:MM format
          };

          // Helper to safely get nested properties
          const getNested = (obj, path) => {
            return path.split('.').reduce((obj, part) => (obj && obj[part] !== undefined ? obj[part] : null), obj);
          };

          // Extract data with safe navigation
          const formattedDate = formatDate(getNested(reservation, 'tanggal_servis'));
          const formattedTime = formatTime(getNested(reservation, 'jam_servis'));
          const vehicleInfo = `${getNested(reservation, 'kendaraan.merk') || '-'} ${getNested(reservation, 'kendaraan.tipe') || ''}`.trim();
          const platNomor = getNested(reservation, 'kendaraan.nomor_polisi') || '-';
          const tahunKendaraan = getNested(reservation, 'kendaraan.tahun') || '-';
          const kilometer = getNested(reservation, 'kendaraan.kilometer') || '-';
          const customerName = getNested(reservation, 'profiles.nama') || '-';
          const customerEmail = getNested(reservation, 'profiles.email') || '-';
          const serviceType = getNested(reservation, 'jenis_servis') || '-';
          const status = getNested(reservation, 'status') || '-';
          const keluhan = getNested(reservation, 'keluhan') || '-';
          const createdAt = getNested(reservation, 'created_at');

          // Payment and transaction data
          const transaksiArray = getNested(reservation, 'transaksi_kasir') || [];
          const transaksi = getFirst(transaksiArray);
          const pembayaran = transaksi ? getFirst(getNested(transaksi, 'pembayaran')) : null;
          const detailTransaksi = transaksi ? getNested(transaksi, 'detail_transaksi_kasir') || [] : [];

          // Format payment info
          const paymentInfo = pembayaran ? `
            <div>
              <h6>Informasi Pembayaran</h6>
              <div class="mb-2"><strong>Metode Pembayaran:</strong> ${pembayaran.metode || '-'}</div>
              <div class="mb-2"><strong>Jumlah Pembayaran:</strong> ${formatRupiah(pembayaran.nominal)}</div>
              <div class="mb-2"><strong>Kembalian:</strong> ${formatRupiah(pembayaran.kembalian || 0)}</div>
              <div class="mb-2"><strong>Status Pembayaran:</strong>
                <span class="badge bg-${pembayaran.status === 'dibayar' ? 'success' : pembayaran.status === 'pending' ? 'warning' : 'danger'}">
                  ${pembayaran.status === 'dibayar' ? 'Lunas' : pembayaran.status === 'pending' ? 'Menunggu' : pembayaran.status || '-'}
                </span>
              </div>
              <div class="mb-2"><strong>Tanggal Pembayaran:</strong> ${pembayaran.dibayar_at ? formatDate(pembayaran.dibayar_at) : '-'}</div>
            </div>
          ` : `
            <div>
              <h6>Informasi Pembayaran</h6>
              <div class="mb-2"><strong>Metode Pembayaran:</strong> Belum ada pembayaran</div>
              <div class="mb-2"><strong>Jumlah Pembayaran:</strong> Rp 0</div>
              <div class="mb-2"><strong>Kembalian:</strong> Rp 0</div>
              <div class="mb-2"><strong>Status Pembayaran:</strong>
                <span class="badge bg-secondary">Belum dibayar</span>
              </div>
              <div class="mb-2"><strong>Tanggal Pembayaran:</strong> -</div>
            </div>
          `;

          // Format service details
          const serviceDetails = detailTransaksi && detailTransaksi.length > 0 ? `
            <div>
              <h6>Detail Layanan dan Sparepart</h6>
              <div class="table-responsive">
                <table class="table table-sm table-bordered">
                  <thead class="table-light">
                    <tr>
                      <th>#</th>
                      <th>Item</th>
                      <th>Tipe</th>
                      <th>Qty</th>
                      <th>Harga Satuan</th>
                      <th>Subtotal</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${detailTransaksi.map((item, index) => {
                      const subtotal = (item.harga || 0) * (item.qty || 1);

                      // Handle possible array relations from joins
                      const serviceRel = getNested(item, 'service_catalog');
                      const serviceArray = Array.isArray(serviceRel) ? serviceRel : [serviceRel];
                      const serviceObj = serviceArray[0] || {};
                      const serviceName = serviceObj.nama || item.nama_item || '-';

                      const stockRel = getNested(item, 'stok_barang');
                      const stockArray = Array.isArray(stockRel) ? stockRel : [stockRel];
                      const stockObj = stockArray[0] || {};
                      const partName = stockObj.nama || item.nama_item || '-';

                      const itemName = serviceName !== '-' ? serviceName : partName;

                      return `
                        <tr>
                          <td>${index + 1}</td>
                          <td>${itemName}</td>
                          <td>${item.tipe_item || '-'}</td>
                          <td>${item.qty || 1}</td>
                          <td>${formatRupiah(item.harga)}</td>
                          <td>${formatRupiah(subtotal)}</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                  <tfoot>
                    <tr>
                      <td colspan="5" class="text-end fw-bold">Total:</td>
                      <td>${formatRupiah(transaksi ? transaksi.total : 0)}</td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>
          ` : `
            <div>
              <h6>Detail Layanan dan Sparepart</h6>
              <div class="text-muted">Detail layanan dan sparepart tidak tersedia</div>
            </div>
          `;

          // Format additional notes
          const notes = getNested(transaksi, 'catatan') || keluhan || '-';

          modalContent.innerHTML = `
            <!-- Invoice Header -->
            <div class="text-center mb-4">
              <img src="/assets/logo-SiMontir.webp" alt="Logo SiMontir" class="img-fluid" style="max-height: 60px;">
              <h5 class="mt-3">SI MONTIR</h5>
              <p class="text-muted">Jl. Raya SiMontir No. 123, Kota Servis</p>
              <p class="text-muted">Telp. (021) 123-4567</p>
            </div>

            <div class="border-bottom pb-3 mb-4">
              <h5 class="mb-0">INVOICE / NOTA</h5>
              <p class="text-muted mb-0">Nomor: ${getNested(transaksi, 'nomor_transaksi') || '-'}</p>
              <p class="text-muted mb-0">Tanggal: ${formattedDate} ${formattedTime !== '-' ? formattedTime : ''}</p>
            </div>

            <div class="row mb-4">
              <div class="col-md-6">
                <h6>Informasi Pelanggan</h6>
                <div class="mb-2"><strong>Nama:</strong> ${customerName}</div>
                <div class="mb-2"><strong>Email:</strong> ${customerEmail}</div>
                <div class="mb-2"><strong>No. Telepon:</strong> -</div>
                <div class="mb-2"><strong>Alamat:</strong> -</div>
              </div>
              <div class="col-md-6">
                <h6>Informasi Kendaraan</h6>
                <div class="mb-2"><strong>Merk/Tipe:</strong> ${vehicleInfo}</div>
                <div class="mb-2"><strong>Nomor Polisi:</strong> ${platNomor}</div>
                <div class="mb-2"><strong>Tahun:</strong> ${tahunKendaraan}</div>
                <div class="mb-2"><strong>Kilometer:</strong> ${kilometer} km</div>
              </div>
            </div>

            <div class="mb-4">
              <h6>Keluhan/Service Request</h6>
              <p class="bg-light p-3 rounded">${keluhan}</p>
            </div>

            ${serviceDetails}

            ${paymentInfo}

            <div class="mb-4">
              <h6>Catatan</h6>
              <p>${notes !== '-' ? notes : '<em class="text-muted">Tidak ada catatan</em>'}</p>
            </div>

            <div class="text-center mt-4 pt-3 border-top">
              <small class="text-muted">
                Terima kasih telah menggunakan layanan SiMontir.<br>
                Sampai jumpa di servis berikutnya!
              </small>
            </div>
          `;

          // Show modal
          if (!invoiceDetailModal) {
            invoiceDetailModal = new bootstrap.Modal(document.getElementById('invoiceDetailModal'));
          }
          invoiceDetailModal.show();
        } catch (err) {
          console.error('Error loading invoice detail:', err);
          modalContent.innerHTML = `
            <div class="text-center py-4">
              <div class="text-danger">
                <i class="bi bi-exclamation-triangle fs-4 mb-3"></i>
                <p>${err.message}</p>
              </div>
              <button type="button" class="btn btn-outline-secondary" onclick="location.reload()">Coba Lagi</button>
            </div>
          `;

          // Show modal even on error
          if (!invoiceDetailModal) {
            invoiceDetailModal = new bootstrap.Modal(document.getElementById('invoiceDetailModal'));
          }
          invoiceDetailModal.show();
        }
      }

      // Histori page functionality
      document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('simontir_token');
        if (!token) {
          window.location.href = '/login';
          return;
        }

        const historyTableBody = document.getElementById('historyTableBody');
        const emptyState = document.getElementById('emptyState');
        const historyTableWrapper = document.getElementById('historyTableWrapper');

        try {
          const response = await fetch('/api/reservations', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const reservations = await response.json();

          if (!response.ok) throw new Error(reservations.message || 'Gagal memuat histori');

          if (reservations.length === 0) {
            emptyState.style.display = 'block';
            historyTableWrapper.style.display = 'none';
            return;
          }

          emptyState.style.display = 'none';
          historyTableWrapper.style.display = 'block';

          reservations.forEach((res, index) => {
            const formattedDate = new Date(res.tanggal_servis).toLocaleDateString('id-ID', {
              day: '2-digit', month: '2-digit', year: 'numeric'
            });

            const formattedTime = res.jam_servis ? res.jam_servis.substring(0, 5) : '-';
            const vehicleInfo = `${res.kendaraan?.merk || '-'} ${res.kendaraan?.tipe || ''}`.trim();
            const platNomor = res.kendaraan?.nomor_polisi || '-';

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${index + 1}</td>
              <td>${formattedDate}</td>
              <td>${formattedTime}</td>
              <td>${vehicleInfo}</td>
              <td>${platNomor}</td>
              <td>${res.jenis_servis || '-'}</td>
              <td>
                <span class="badge bg-${res.status === 'success' ? 'success' : res.status === 'onProgress' ? 'warning' : 'secondary'}">
                  ${res.status === 'success' ? 'Selesai' : res.status === 'onProgress' ? 'Dalam Proses' : res.status || '-'}
                </span>
              </td>
              <td>
                <button class="btn btn-sm btn-outline-info" onclick="showInvoiceDetail(${res.id})">
                  <i class="bi bi-file-earmark-text me-1"></i>Detail
                </button>
              </td>
            `;
            historyTableBody.appendChild(tr);
          });
        } catch (err) {
          console.error('Error loading history:', err);
          historyTableBody.innerHTML = `
            <tr>
              <td colspan="7" class="text-center text-danger">
                <i class="bi bi-exclamation-triangle me-2"></i>
                Gagal memuat histori: ${err.message}
              </td>
            </tr>
          `;
        }
      });
      // Set active nav link
      const path = window.location.pathname;
      document.querySelectorAll('.nav-link').forEach(link => {
        if (link.getAttribute('href') === path) {
          link.classList.add('active');
        }
      });
    </script>
  </body>
</html>
