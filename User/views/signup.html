<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up Pelanggan - SiMontir</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card">
        <div class="text-center mb-4">
          <img class="brand-logo mb-2" src="/assets/logo-SiMontir.webp" alt="Logo SiMontir">
          <h1 class="h4 fw-bold mb-1">Sign Up Pelanggan</h1>
          <p class="text-muted-clean mb-0">Buat akun untuk reservasi servis.</p>
        </div>
        <div class="alert alert-danger" id="authAlert" hidden></div>
        <form data-auth-form="register">
          <div class="mb-3">
            <label class="form-label" for="nama">Nama</label>
            <input class="form-control" id="nama" name="nama" type="text" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" minlength="6" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="nomor_handphone">Nomor Handphone</label>
            <input class="form-control" id="nomor_handphone" name="nomor_handphone" type="tel" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="provinsi">Provinsi</label>
            <select class="form-select" id="provinsi" name="provinsi" required>
              <option value="">Pilih Provinsi</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="kota_domisili">Kota Domisili</label>
            <select class="form-select" id="kota_domisili" name="kota_domisili" required disabled>
              <option value="">Pilih Kota/Kabupaten</option>
            </select>
          </div>
          <button class="btn btn-simontir w-100" type="submit">Sign Up</button>
        </form>
        <p class="text-center mt-3 mb-0">
          Sudah punya akun? <a href="/login">Login</a>
        </p>
        <p class="text-center mt-2 mb-0"><a href="/">Kembali ke beranda</a></p>
      </section>
    </main>
    <script src="/js/auth.js"></script>
    <script>
      const provinsiSelect = document.getElementById('provinsi');
      const kotaSelect = document.getElementById('kota_domisili');

      // Fetch local provinces
      fetch('/js/data/provinces.json')
        .then(response => response.json())
        .then(provinces => {
          provinces.forEach(prov => {
            const option = document.createElement('option');
            option.value = prov.name;
            option.dataset.id = prov.id;
            option.textContent = prov.name;
            provinsiSelect.appendChild(option);
          });
        });

      provinsiSelect.addEventListener('change', (e) => {
        const provId = e.target.options[e.target.selectedIndex].dataset.id;
        kotaSelect.innerHTML = '<option value="">Pilih Kota/Kabupaten</option>';
        if (!provId) {
          kotaSelect.disabled = true;
          return;
        }

        // Fetch local regencies
        fetch('/js/data/regencies.json')
          .then(response => response.json())
          .then(data => {
            const regencies = data[provId] || [];
            regencies.forEach(reg => {
              const option = document.createElement('option');
              option.value = reg.name;
              option.textContent = reg.name;
              kotaSelect.appendChild(option);
            });
            kotaSelect.disabled = false;
          });
      });
    </script>
  </body>
</html>
