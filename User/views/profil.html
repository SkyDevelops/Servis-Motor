<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profil Saya - SiMontir</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
          <img class="brand-logo" src="/assets/logo-SiMontir.webp" alt="Logo SiMontir">
          SiMontir
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/reservasi">Reservasi</a></li>
            <li class="nav-item"><a class="nav-link" href="/histori">Histori</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <h2 class="fw-bold mb-4">Profil Saya</h2>
      <div class="row g-4">
        <div class="col-md-6">
          <div class="card p-4 border-0 shadow-sm">
            <h5 class="fw-bold mb-3">Data Diri</h5>
            <form id="profileForm">
              <div class="mb-3">
                <label class="form-label">Nama</label>
                <input class="form-control" id="nama" name="nama" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Nomor Handphone</label>
                <input class="form-control" id="nomor_handphone" name="nomor_handphone" required>
              </div>
              <button class="btn btn-simontir" type="submit">Simpan Perubahan</button>
            </form>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card p-4 border-0 shadow-sm">
            <h5 class="fw-bold mb-3">Kendaraan</h5>
            <div id="vehicleList" class="mb-3"></div>
            <a href="/reservasi" class="btn btn-outline-primary">Tambah Kendaraan Baru</a>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const token = localStorage.getItem('simontir_token');
      const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
      const profileForm = document.getElementById('profileForm');

      // Load profile data
      async function loadProfile() {
        try {
          const res = await fetch('/api/auth/me', { headers }); // Assuming this endpoint exists or will be needed
          if (res.ok) {
            const user = await res.json();
            document.getElementById('nama').value = user.nama || '';
            document.getElementById('nomor_handphone').value = user.nomor_handphone || '';
          }
        } catch (err) {
          console.error('Error loading profile:', err);
        }
      }

      // Handle profile update
      profileForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(profileForm);
        const payload = Object.fromEntries(formData.entries());

        try {
          const res = await fetch('/api/auth/profile', {
            method: 'PUT',
            headers,
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            alert('Profil berhasil diperbarui!');
          } else {
            throw new Error('Gagal memperbarui profil');
          }
        } catch (err) {
          alert(err.message);
        }
      });

      async function loadVehicles() {
        const res = await fetch('/api/vehicles', { headers });
        const data = await res.json();
        const list = document.getElementById('vehicleList');
        if (data.length === 0) {
           list.innerHTML = '<p class="text-muted small">Belum ada kendaraan.</p>';
           return;
        }
        list.innerHTML = data.map(v => `
          <div class="d-flex justify-content-between align-items-center mb-2 p-2 border rounded">
            <span>${v.merk} ${v.tipe} (${v.nomor_polisi})</span>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteVehicle('${v.id}')"><i class="bi bi-trash"></i></button>
          </div>
        `).join('');
      }

      async function deleteVehicle(id) {
        if(confirm('Hapus kendaraan ini?')) {
          await fetch(`/api/vehicles/${id}`, { method: 'DELETE', headers });
          loadVehicles();
        }
      }

      loadProfile();
      loadVehicles();
    </script>
  </body>
</html>
