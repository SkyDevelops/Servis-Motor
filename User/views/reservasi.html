<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reservasi Servis - SiMontir</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
          <img class="brand-logo" src="/assets/logo-SiMontir.webp" alt="Logo SiMontir">
          SiMontir
        </a>
        <button class="btn btn-outline-secondary btn-sm ms-auto" id="logoutButton" type="button">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>
      </div>
    </nav>

    <main class="py-4">
      <div class="container">
        <div class="d-flex flex-wrap align-items-end justify-content-between gap-2 mb-3">
          <div>
            <h1 class="h3 fw-bold mb-1">Reservasi Servis</h1>
            <p class="text-muted-clean mb-0">Tambahkan kendaraan, lalu pilih jadwal servis.</p>
          </div>
        </div>

        <div class="alert alert-danger" id="pageAlert" hidden></div>

        <div class="row g-3">
          <div class="col-lg-5">
            <section class="panel mb-3">
              <h2 class="h5 fw-bold mb-3">Data Kendaraan</h2>
              <form id="vehicleForm">
                <div class="row g-2">
                  <div class="col-md-6">
                    <label class="form-label" for="merk">Merk</label>
                    <input class="form-control" id="merk" name="merk" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="tipe">Tipe</label>
                    <input class="form-control" id="tipe" name="tipe" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="nomor_polisi">Nomor Polisi</label>
                    <input class="form-control" id="nomor_polisi" name="nomor_polisi" required>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label" for="tahun">Tahun</label>
                    <input class="form-control" id="tahun" name="tahun" type="number">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label" for="kilometer">KM</label>
                    <input class="form-control" id="kilometer" name="kilometer" type="number" min="0">
                  </div>
                </div>
                <button class="btn btn-simontir mt-3" type="submit">Simpan Kendaraan</button>
              </form>
            </section>

            <section class="panel">
              <h2 class="h5 fw-bold mb-3">Buat Reservasi</h2>
              <form id="reservationForm">
                <div class="mb-3">
                  <label class="form-label" for="kendaraan_id">Kendaraan</label>
                  <select class="form-select" id="kendaraan_id" name="kendaraan_id" required></select>
                </div>
                <div class="row g-2">
                  <div class="col-md-6">
                    <label class="form-label" for="tanggal_servis">Tanggal</label>
                    <input class="form-control" id="tanggal_servis" name="tanggal_servis" type="date" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="jam_servis">Jam</label>
                    <input class="form-control" id="jam_servis" name="jam_servis" type="time" required>
                  </div>
                </div>
                <div class="mt-3">
                  <label class="form-label" for="jenis_servis">Jenis Servis</label>
                  <select class="form-select" id="jenis_servis" name="jenis_servis" required>
                    <option value="">Pilih jenis servis</option>
                    <option>Servis Ringan</option>
                    <option>Ganti Oli</option>
                    <option>Tune Up</option>
                    <option>Servis Besar</option>
                  </select>
                </div>
                <div class="mt-3">
                  <label class="form-label" for="keluhan">Keluhan</label>
                  <textarea class="form-control" id="keluhan" name="keluhan" rows="3"></textarea>
                </div>
                <button class="btn btn-simontir mt-3" type="submit">Kirim Reservasi</button>
              </form>
            </section>
          </div>

          <div class="col-lg-7">
            <section class="panel mb-3">
              <h2 class="h5 fw-bold mb-3">Kendaraan Saya</h2>
              <div class="table-wrap">
                <table class="table align-middle">
                  <thead>
                    <tr>
                      <th>Merk</th>
                      <th>Tipe</th>
                      <th>Nomor Polisi</th>
                      <th>Tahun</th>
                      <th>KM</th>
                    </tr>
                  </thead>
                  <tbody id="vehicleTable"></tbody>
                </table>
              </div>
            </section>
            <section class="panel">
              <h2 class="h5 fw-bold mb-3">Riwayat Reservasi</h2>
              <div class="table-wrap">
                <table class="table align-middle">
                  <thead>
                    <tr>
                      <th>Tanggal</th>
                      <th>Jam</th>
                      <th>Kendaraan</th>
                      <th>Jenis</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="reservationTable"></tbody>
                </table>
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>
    <script src="/js/reservasi.js"></script>
  </body>
</html>
